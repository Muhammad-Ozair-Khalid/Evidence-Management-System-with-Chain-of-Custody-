services:
  postgres:
    image: postgres:16-alpine
    container_name: ems-coc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_dev_password
      POSTGRES_DB: ems_coc
    volumes:
      - ems_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems_coc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ems_pg_data:
